##### ─────────────────────────────
# CORE
##### ─────────────────────────────

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1

bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"

bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind r source-file ~/.tmux.conf \; display "Reloaded"

##### ─────────────────────────────
# MOUSE
##### ─────────────────────────────

set -g mouse on

##### ─────────────────────────────
# SYSTEM CLIPBOARD (CROSS-PLATFORM)
##### ─────────────────────────────

set-environment -g TMUX_COPY_CMD "sh -lc '
if command -v pbcopy >/dev/null 2>&1; then
  pbcopy
elif command -v wl-copy >/dev/null 2>&1; then
  wl-copy
else
  cat
fi'"

##### ─────────────────────────────
# COPY MODE (VI)
##### ─────────────────────────────

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$TMUX_COPY_CMD"

##### ─────────────────────────────
# MOUSE COPY
##### ─────────────────────────────

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$TMUX_COPY_CMD"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "$TMUX_COPY_CMD"
