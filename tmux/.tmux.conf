##### ─────────────────────────────
# CORE
##### ─────────────────────────────

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1

bind r source-file ~/.tmux.conf \; display "Reloaded"

##### ─────────────────────────────
# MOUSE
##### ─────────────────────────────

set -g mouse on

##### ─────────────────────────────
# SYSTEM CLIPBOARD (CROSS-PLATFORM)
##### ─────────────────────────────

set-environment -g TMUX_COPY_CMD "sh -lc '
if command -v pbcopy >/dev/null 2>&1; then
  pbcopy
elif command -v wl-copy >/dev/null 2>&1; then
  wl-copy
else
  cat
fi'"

##### ─────────────────────────────
# COPY MODE (VI)
##### ─────────────────────────────

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$TMUX_COPY_CMD"

##### ─────────────────────────────
# MOUSE COPY
##### ─────────────────────────────

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$TMUX_COPY_CMD"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "$TMUX_COPY_CMD"
